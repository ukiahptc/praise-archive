
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"   stop-color="#2C3159"/>
      <stop offset="0.55" stop-color="#20243F"/>
      <stop offset="1"   stop-color="#14162A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#FBEFCF"/>
      <stop offset="0.30" stop-color="#E3BE73"/>
      <stop offset="0.62" stop-color="#B07D2B"/>
      <stop offset="1"    stop-color="#7C5313"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.55">
      <stop offset="0"   stop-color="#C79448" stop-opacity="0.40"/>
      <stop offset="0.6" stop-color="#B07D2B" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#B07D2B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.78" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="staffMask"><rect width="512" height="512" fill="url(#fade)"/></mask>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(0 0) scale(1)">
    <circle cx="256" cy="252" r="230" fill="url(#glow)"/>

    <!-- 오선 -->
    <g mask="url(#staffMask)" stroke="#8B93C9" stroke-opacity="0.30" stroke-width="9" stroke-linecap="round">
      <line x1="46" y1="176" x2="466" y2="176"/>
      <line x1="46" y1="228" x2="466" y2="228"/>
      <line x1="46" y1="280" x2="466" y2="280"/>
      <line x1="46" y1="332" x2="466" y2="332"/>
    </g>

    <!-- 8분음표: 바탕과 떨어져 보이도록 네이비 테두리를 먼저 깐다 -->
    <g id="noteEdge" transform="translate(-15 -10)" fill="#14162A" stroke="#14162A" stroke-width="26" stroke-linejoin="round">
      <path d="M300 118
               c 46 26 88 52 100 96
               c 9 33 -3 62 -22 84
               c 6 -34 -6 -60 -32 -80
               c -18 -14 -34 -24 -46 -32 Z" />
      <rect x="278" y="112" width="26" height="248" rx="13"/>
      <ellipse cx="216" cy="360" rx="76" ry="56" transform="rotate(-20 216 360)"/>
    </g>
    <g fill="url(#gold)" transform="translate(-15 -10)">
      <path d="M300 118 c 46 26 88 52 100 96 c 9 33 -3 62 -22 84 c 6 -34 -6 -60 -32 -80 c -18 -14 -34 -24 -46 -32 Z"/>
      <rect x="278" y="112" width="26" height="248" rx="13"/>
      <ellipse cx="216" cy="360" rx="76" ry="56" transform="rotate(-20 216 360)"/>
    </g></g>
</svg>